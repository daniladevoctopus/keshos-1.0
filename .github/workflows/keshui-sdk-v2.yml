name: KeshUI SDK

permissions:
  contents: write

on:
  push:
    branches: [ keshui-sdk-v2, keshui-sdk-v3 ]
    paths:
      - 'experiments/KeshUI-SDK-v2/**'
      - '.github/workflows/keshui-sdk-v2.yml'
  pull_request:
    paths:
      - 'experiments/KeshUI-SDK-v2/**'

jobs:
  linux-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/KeshUI-SDK-v2
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libx11-dev libcairo2-dev libpango1.0-dev xvfb imagemagick
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --verbose
      - name: Validate XAML
        run: ./build/kxc --check demo/MainWindow.xaml
      - name: Dump compiled XAML IR
        run: ./build/kxc --dump-ir demo/MainWindow.xaml
      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
      - name: Capture real gallery screenshot under Xvfb
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            set -e
            ./build/keshui_gallery > build/gallery.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 2
            import -display "$DISPLAY" -window root build/keshui-gallery-root.png
            convert build/keshui-gallery-root.png -crop 1440x900+120+80 +repage build/keshui-gallery.png
          '
      - name: Smoke-start gallery under Xvfb
        shell: bash
        run: |
          set +e
          timeout 3s xvfb-run -a ./build/keshui_gallery
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
      - name: Upload real gallery screenshot
        uses: actions/upload-artifact@v4
        with:
          name: keshui-gallery-screenshot
          path: experiments/KeshUI-SDK-v2/build/keshui-gallery.png
          if-no-files-found: error
      - name: Publish latest real gallery screenshot to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/keshui-sdk-v3'
        shell: bash
        run: |
          mkdir -p ../../artifacts
          cp build/keshui-gallery.png ../../artifacts/keshui-gallery.png
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/keshui-gallery.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
          else
            git commit -m "Artifacts: update real KeshUI gallery screenshot"
            git push origin HEAD:keshui-sdk-v3
          fi
