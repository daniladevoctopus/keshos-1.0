name: KeshUI SDK

on:
  push:
    branches: [ keshui-sdk-v2, keshui-sdk-v3 ]
    paths:
      - 'experiments/KeshUI-SDK-v2/**'
      - '.github/workflows/keshui-sdk-v2.yml'
  pull_request:
    paths:
      - 'experiments/KeshUI-SDK-v2/**'

jobs:
  linux-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/KeshUI-SDK-v2
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libx11-dev libcairo2-dev libpango1.0-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --verbose
      - name: Validate XAML
        run: ./build/kxc --check demo/MainWindow.xaml
      - name: Dump compiled XAML IR
        run: ./build/kxc --dump-ir demo/MainWindow.xaml
      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
      - name: Smoke-start gallery under Xvfb
        shell: bash
        run: |
          set +e
          timeout 3s xvfb-run -a ./build/keshui_gallery
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
